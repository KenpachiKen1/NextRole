events {}

http {
    # Docker's embedded DNS server. Needed so nginx re-resolves the
    # "backend" service name instead of caching the first IP it sees —
    # that's what lets it discover every scaled replica.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;

        location / {
            # Using a variable (instead of a literal proxy_pass target)
            # forces nginx to re-resolve "backend" on each request via
            # the resolver above, which is what makes this rotate across
            # all replicas from `docker compose up --scale backend=N`.
            set $backend_upstream http://backend:8080;
            proxy_pass $backend_upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Reveals which backend container actually handled the
            # request — this is what you'll watch change between calls.
            add_header X-Upstream-Addr $upstream_addr always;
        }
    }
}
