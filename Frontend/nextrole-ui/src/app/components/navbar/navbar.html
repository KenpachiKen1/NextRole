<header class="h-16 bg-white border-b border-[#E4DDCC] flex items-center justify-between px-7">

    <div class="flex items-center gap-2 bg-[#F6F2E9] border border-[#E4DDCC] rounded-lg px-3 py-2 w-72">
        <span class="text-[#475569] text-sm" aria-hidden="true"></span>
        <label for="global-search" class="sr-only">Search company or job title</label>
        <input
            id="global-search"
            type="search"
            [(ngModel)]="searchTerm"
            (keyup.enter)="search()"
            placeholder="Search company or job title..."
            class="bg-transparent border-none outline-none text-sm text-[#1B2430] placeholder-[#475569] w-full"/>
    </div>

    <div class="flex items-center gap-4">
        <div class="w-9 h-9 rounded-full bg-[#1B2430] text-[#F3E9CD] flex items-center justify-center text-xs font-medium">
            {{ currentUser()?.username?.charAt(0)?.toUpperCase() }}
        </div>
    </div>

</header>
