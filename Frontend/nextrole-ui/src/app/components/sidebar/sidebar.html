<aside class="w-58 h-full bg-[#1B2430] text-[#EDEAE1] flex flex-col px-4.5 py-6">

    <div class="flex items-center gap-2.5 mb-9 pl-1">
        <div class="w-7.5 h-7.5 rounded-[7px] bg-[#B9932A] flex items-center justify-center">
            <span class="text-[#1B2430] font-semibold text-sm" style="font-family:'Fraunces',serif;">N</span>
        </div>
        <span class="text-lg" style="font-family:'Fraunces',serif; font-weight:500;">NextRole</span>
    </div>

    <nav aria-label="Main" class="flex flex-col gap-0.5">
        <a routerLink="/calendar" routerLinkActive="bg-[#B9932A]/[.14] text-[#B9932A] font-bold" #calendarLink="routerLinkActive"
           [attr.aria-current]="calendarLink.isActive ? 'page' : null"
           class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-white font-bold hover:bg-white/6 transition">
            <span class="w-4 text-center text-xs" aria-hidden="true"></span> Calendar
        </a>
        <a routerLink="/resume" routerLinkActive="bg-[#B9932A]/[.14] text-[#B9932A] font-bold" #resumeLink="routerLinkActive"
           [attr.aria-current]="resumeLink.isActive ? 'page' : null"
           class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-white font-bold hover:bg-white/6 transition">
            <span class="w-4 text-center text-xs" aria-hidden="true"></span> Resumes
        </a>
        <a routerLink="/job-postings" routerLinkActive="bg-[#B9932A]/[.14] text-[#B9932A] font-bold" #jobPostingsLink="routerLinkActive"
           [attr.aria-current]="jobPostingsLink.isActive ? 'page' : null"
           class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-white font-bold hover:bg-white/6 transition">
            <span class="w-4 text-center text-xs" aria-hidden="true"></span> Job postings
        </a>
        <a routerLink="/ai-hub" routerLinkActive="bg-[#B9932A]/[.14] text-[#B9932A] font-bold" #aiHubLink="routerLinkActive"
           [attr.aria-current]="aiHubLink.isActive ? 'page' : null"
           class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-white font-bold hover:bg-white/6 transition">
            <span class="w-4 text-center text-xs" aria-hidden="true"></span>AI Hub
        </a>
    </nav>

    <div class="h-px bg-white/8 my-4 mx-1"></div>
    <div class="text-[11px] uppercase tracking-wider text-[#6D7280] px-3 pb-2" id="workspace-nav-heading">Workspace</div>

    <nav aria-labelledby="workspace-nav-heading" class="flex flex-col gap-0.5">
        <a routerLink="/settings" routerLinkActive="bg-[#B9932A]/[.14] text-[#B9932A] font-bold" #settingsLink="routerLinkActive"
           [attr.aria-current]="settingsLink.isActive ? 'page' : null"
           class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-white font-bold hover:bg-white/6 transition">
            <span class="w-4 text-center text-xs" aria-hidden="true"></span> Settings
        </a>
        <a routerLink="/subscription" routerLinkActive="bg-[#B9932A]/[.14] text-[#B9932A] font-bold" #subscriptionLink="routerLinkActive"
           [attr.aria-current]="subscriptionLink.isActive ? 'page' : null"
           class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-white font-bold hover:bg-white/6 transition">
            <span class="w-4 text-center text-xs" aria-hidden="true"></span> Subscription
        </a>
    </nav>

    <div class="mt-auto flex flex-col gap-4">

        <div>
            <p class="text-[11px] uppercase tracking-wider text-[#6D7280] px-1 pb-2">Connect with me</p>
            <div class="flex items-center gap-3 px-1">
                <a href="https://www.instagram.com/13kken/" target="_blank" rel="noopener noreferrer"
                   aria-label="Instagram" title="Instagram"
                   class="text-[#DEDBD1] hover:text-[#B9932A] transition">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="w-5 h-5" aria-hidden="true">
                        <rect x="3" y="3" width="18" height="18" rx="5"/>
                        <circle cx="12" cy="12" r="4"/>
                        <circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none"/>
                    </svg>
                </a>
                <a href="https://www.linkedin.com/in/kentimi" target="_blank" rel="noopener noreferrer"
                   aria-label="LinkedIn" title="LinkedIn"
                   class="text-[#DEDBD1] hover:text-[#B9932A] transition">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5" aria-hidden="true">
                        <path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9h4v12H3zM9 9h3.8v1.7h.05c.53-.95 1.83-1.95 3.77-1.95 4.03 0 4.78 2.5 4.78 5.75V21h-4v-5.6c0-1.34-.02-3.06-1.87-3.06-1.87 0-2.15 1.46-2.15 2.96V21H9z"/>
                    </svg>
                </a>
                <a href="https://psnprofiles.com/kenpachiken1" target="_blank" rel="noopener noreferrer"
                   aria-label="PlayStation Network" title="PlayStation Network"
                   class="text-[#DEDBD1] hover:text-[#B9932A] transition">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" class="w-5 h-5" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3.5 14.6 8.3H9.4Z"/>
                        <circle cx="18.6" cy="12" r="2.15"/>
                        <path stroke-linecap="round" d="M10.5 18.6 13.6 21.7M13.6 18.6 10.5 21.7"/>
                        <rect x="3.3" y="9.85" width="4.3" height="4.3"/>
                    </svg>
                </a>
                <button type="button" (click)="copyDiscordUsername()"
                        aria-label="Copy Discord username" title="Discord: {{ discordUsername }} (click to copy)"
                        class="relative text-[#DEDBD1] hover:text-[#B9932A] transition cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5" aria-hidden="true">
                        <path d="M20.32 5.36A18.5 18.5 0 0 0 15.87 4a13 13 0 0 0-.6 1.23 17.2 17.2 0 0 0-5.53 0A13 13 0 0 0 9.13 4a18.5 18.5 0 0 0-4.45 1.36C1.9 9.3 1.2 13.14 1.55 16.93a18.6 18.6 0 0 0 5.66 2.85c.46-.62.86-1.28 1.2-1.98a12 12 0 0 1-1.9-.9c.16-.11.31-.24.46-.36a13.2 13.2 0 0 0 11.36 0c.15.13.3.25.46.36-.6.36-1.24.66-1.9.9.34.7.74 1.36 1.2 1.98a18.5 18.5 0 0 0 5.66-2.85c.4-4.4-.72-8.2-3.04-11.57zM8.68 14.6c-.98 0-1.78-.9-1.78-2s.79-2 1.78-2 1.8.9 1.78 2c0 1.1-.79 2-1.78 2zm6.64 0c-.98 0-1.78-.9-1.78-2s.79-2 1.78-2 1.8.9 1.78 2c0 1.1-.78 2-1.78 2z"/>
                    </svg>
                    @if (discordCopied()) {
                        <span class="absolute -top-7 left-1/2 -translate-x-1/2 whitespace-nowrap text-[10px] font-medium bg-[#1B2430] text-[#DEDBD1] border border-white/15 rounded px-2 py-1">
                            Copied!
                        </span>
                    }
                </button>
            </div>
        </div>

        <div class="pt-4 border-t border-white/8 flex items-center gap-2.5">
            <div>
                <p class="text-sm text-[#DEDBD1]">{{currentUser()?.username}}</p>
            </div>
        </div>

    </div>

</aside>
