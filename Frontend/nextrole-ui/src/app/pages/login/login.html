<div class="min-h-screen bg-white flex items-center justify-center px-4">
  <div class="w-full max-w-md">

    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-[#1B2430]" style="font-family:'Fraunces',serif;">
        NextRole
      </h1>
      <p class="text-gray-500 mt-2 text-sm">
        Welcome back — let's get you to your applications
      </p>
    </div>


    <div class="bg-white rounded-2xl shadow-lg border border-gray-100 p-8">

      <form 
        class="space-y-5"
        [formGroup]="loginForm"
        (ngSubmit)="onSubmit()">


        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
            Email
          </label>

          <input 
            id="email"
            type="email"
            formControlName="email"
            placeholder="Enter email"
            class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#B9932A] focus:border-transparent transition"/>
        </div>


        <div>
          <div class="flex items-center justify-between mb-1">
            <label for="password" class="block text-sm font-medium text-gray-700">
              Password
            </label>
            <a href="#" class="text-xs text-[#B9932A] hover:text-[#1B2430] transition">
              Forgot password?
            </a>
          </div>

          <input
            id="password"
            type="password"
            formControlName="password"
            placeholder="Enter password"
            class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#B9932A] focus:border-transparent transition"/>
        </div>


        <button
          type="submit"
          class="w-full py-2.5 rounded-lg text-[#F3E9CD] font-medium bg-[#1B2430] hover:bg-[#242E3D] transition shadow-md shadow-gray-200 mt-4">
          Sign in
        </button>


      </form>


      <div class="rounded-lg border-l-4 border-[#B9932A] bg-[#F6F2E9] px-4 py-3 text-sm text-gray-600 mt-6">
        Pick up right where you left off.
      </div>


      <p class="text-center text-sm text-gray-500 mt-6">
        Don't have an account?
        <a routerLink="/register" class="text-[#1B2430] font-medium hover:text-[#B9932A] transition">
          Create one
        </a>
      </p>


    </div>

  </div>
</div>
