<div class="flex items-center justify-between text-white p-5 pl-5">

    <div class="text-4xl font-semibold text-black">
        {{ displayDate() | date: 'MMMM y' }}    
    </div>

    <div class="flex gap-2">
        <app-button (click)="prevMonth()">
            Previous
        </app-button>

        <app-button (click)="nextMonth()">
            Next
        </app-button>
    </div>

</div>
<div class="flex"> 
 <ul class="flex flex-wrap gap-x-6 gap-y-2 list-none m-2 p-0">
  @for (status of jobStatuses; track status.key) {
    <li class="flex items-center gap-2">
      <span
        class="w-3 h-3 rounded-full shrink-0"
        [style.background-color]="status.color">
      </span>

      <span>{{ status.label }}</span>
    </li>
  }
</ul>
</div>
<div class="bg-white border border-[#E4DDCC] rounded-xl overflow-hidden">
<div class="grid grid-cols-7 border-b border-[#E4DDCC]">
        @for (day of daysOfTheWeek; track day) {
            <div class="text-center text-[11px] font-medium uppercase tracking-wider text-[#8A8F99] py-2.5">
            {{ day }}
            </div>
        }
</div>
<div class="grid grid-cols-7">
    @for (day of grid(); track day.date) {
      <div
        class="min-h-24 border-r border-b border-[#E4DDCC] p-2 nth-[7n]:border-r-0  hover:bg-[#FAF8F2] cursor-pointer"
        [ngClass]="{
          'bg-white': day.isCurrentMonth,
          'bg-[#FAF8F2]': !day.isCurrentMonth
        }"
        (click)="openDay(day)">

        <span
          class="inline-flex items-center justify-center w-5 h-5 rounded-full font-mono text-xs"
          [ngClass]="{
            'bg-[#1B2430] text-[#F3E9CD]': day.isCurrentDay,
            'text-[#8A8F99]': !day.isCurrentDay && !day.isCurrentMonth,
            'text-[#1B2430]': !day.isCurrentDay && day.isCurrentMonth
          }">
          {{ day.date.getDate() }}
        </span>

      </div>
    }
  </div>
</div>

<app-calendar-entry-popup
    [selectedDay]="selectedDay()"
    (close)="closeDayPopup()"
    (deleteEntry)="handleDeleteEntry($event)"
    (editEntry)="handleEditEntry($event)"
    (addEntry)="openAddEntryFlow($event)">
</app-calendar-entry-popup>

@if (newEntryDate()) {
  <app-calendar-add-entry-flow
      [initialDate]="newEntryDate()"
      (close)="closeAddEntryFlow()"
      (submitted)="addEntry($event)">
  </app-calendar-add-entry-flow>
}

<app-edit-job-entry-form
    [entry]="editingEntry()"
    (close)="closeEditForm()"
    (submitted)="handleEditSubmit($event)">
</app-edit-job-entry-form>
