<div class="p-6">


    <div class="flex items-center justify-between mb-6">


        <h2 class="text-2xl font-bold">
            My Resumes
        </h2>



        <app-button
            variant="create"
            (click)="showCreateResumeModal = true">

            Create Resume

        </app-button>


    </div>





    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">


        @for(resume of user_resume_list(); track resume.id){


            <app-resume-card

                [resume]="resume"

                (selected)="openResumeDetail($event)">

            </app-resume-card>


        }


    </div>


</div>





@if(showCreateResumeModal){


    <app-create-resume-modal

        (close)="showCreateResumeModal = false"

        (resumeCreated)="loadResumes()">

    </app-create-resume-modal>


}





@if(selectedResumeForModal){

    <app-resume-detail-modal

        [resume]="selectedResumeForModal"

        [previewUrl]="previewUrl()"

        [isLoading]="isLoadingPreview()"

        (close)="closeResumeDetail()"

        (edit)="handleEditFromModal($event)"

        (delete)="handleDeleteFromModal($event)">

    </app-resume-detail-modal>

}

@if(showEditResumeModal()){

    <app-modal (close)="closeEditResumeModal()">

        <div class="w-140 flex flex-col gap-5">

            <h2 class="text-xl font-bold text-[#1B2430]">
                Edit Resume
            </h2>

            <app-input
                label="Resume Name"
                placeholder="Enter resume name"
                [control]="updateResumeForm.controls.resumeTitle">
            </app-input>

            <div class="flex gap-3">
                <app-button
                    variant="secondary"
                    (click)="closeEditResumeModal()">
                    Cancel
                </app-button>

                <app-button
                    variant="create"
                    (click)="updateResume()">
                    Save
                </app-button>
            </div>

        </div>

    </app-modal>

}
